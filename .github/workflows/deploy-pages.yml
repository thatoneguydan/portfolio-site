name: Portfolio GitHub Pages Configuration

on:
  push:
    branches: [main]
    paths:
      - '.github/pages-deploy-request.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: portfolio-github-pages
  cancel-in-progress: false

jobs:
  configure:
    name: Validate and build temporary GitHub Pages site
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out public repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve and validate Pages request
        id: request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content '.github/pages-deploy-request.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $receipt = Get-Content '.github/publication-receipt.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$request.requestId -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$') { throw 'Invalid Pages requestId.' }
          if ([string]$request.customDomain -cne 'preview.dantylersmith.com') { throw 'Initial Pages deployment is restricted to preview.dantylersmith.com.' }
          if ([string]$request.candidateSha256 -cne [string]$receipt.candidateSha256) { throw 'Pages candidate SHA differs from publication receipt.' }
          if ([string]$request.publicTreeSha256 -cne [string]$receipt.publicTreeSha256) { throw 'Pages public-tree SHA differs from publication receipt.' }
          if ([int64]$request.publicFiles -ne [int64]$receipt.publicFiles) { throw 'Pages public-file count differs from publication receipt.' }
          if ([int64]$request.publicBytes -ne [int64]$receipt.publicBytes) { throw 'Pages public-byte count differs from publication receipt.' }
          if (-not (Test-Path -LiteralPath 'index.html' -PathType Leaf)) { throw 'Published root index.html is missing.' }
          "request_id=$([string]$request.requestId)" >> $env:GITHUB_OUTPUT
          "custom_domain=$([string]$request.customDomain)" >> $env:GITHUB_OUTPUT

      - name: Verify managed Glass runtime
        shell: pwsh
        run: |
          $version = (node --version 2>&1 | Out-String).Trim()
          if ($version -notmatch '^v24\.') { throw "Expected managed Node 24; found '$version'." }

      - name: Validate repository Pages settings
        id: pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $domain = '${{ steps.request.outputs.custom_domain }}'
          $state = gh api "repos/$repo/pages" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Pages is not enabled for this repository.' }
          Write-Host "Pages status: $([string]$state.status)"
          Write-Host "Pages html_url: $([string]$state.html_url)"
          Write-Host "Pages protected_domain_state: $([string]$state.protected_domain_state)"
          Write-Host "Pages https_enforced: $([bool]$state.https_enforced)"
          Write-Host "Pages certificate state: $([string]$state.https_certificate.state)"
          Write-Host "Pages certificate description: $([string]$state.https_certificate.description)"
          Write-Host "Pages certificate domains: $([string]::Join(',', @($state.https_certificate.domains)))"
          if ([string]$state.cname -cne $domain) { throw "GitHub Pages custom domain mismatch: '$($state.cname)' != '$domain'." }
          if ([string]$state.source.branch -cne 'main' -or [string]$state.source.path -cne '/') { throw "GitHub Pages publishing source must be main:/; found '$($state.source.branch):$($state.source.path)'." }
          if ([string]$state.build_type -cne 'legacy') { throw "GitHub Pages must use branch-source publishing; found build_type '$($state.build_type)'." }
          "html_url=$([string]$state.html_url)" >> $env:GITHUB_OUTPUT

      - name: Request Pages build from current main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/pages/builds" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not request GitHub Pages build.' }

      - name: Wait for Pages build result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddMinutes(10)
          do {
            Start-Sleep -Seconds 10
            $build = gh api "repos/$env:GITHUB_REPOSITORY/pages/builds/latest" | ConvertFrom-Json
            $status = [string]$build.status
            Write-Host "Latest Pages build status: $status"
            if ($status -eq 'built') {
              @"
          ## Portfolio GitHub Pages preview configured

          - Request: `${{ steps.request.outputs.request_id }}`
          - URL: `${{ steps.pages.outputs.html_url }}`
          - Custom domain: `${{ steps.request.outputs.custom_domain }}`
          - Source: `main:/`
          - Build: `built`
          "@ >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            if ($status -eq 'errored') {
              throw "GitHub Pages build failed: $($build.error.message)"
            }
          } while ((Get-Date) -lt $deadline)
          throw 'Timed out waiting for GitHub Pages build.'
