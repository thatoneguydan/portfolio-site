name: GitHub Pages Artifact Cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-artifact-cleanup.yml']
  deployment_status:
  schedule:
    - cron: '17 * * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: github-pages-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages') }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 10
    steps:
      - name: Delete completed Pages transfer artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $targets = [System.Collections.Generic.List[object]]::new()
          for ($page = 1; ; $page++) {
            $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $items = @($response.artifacts)
            foreach ($artifact in $items) {
              if ([string]$artifact.name -cne 'github-pages') { continue }

              $runId = [string]$artifact.workflow_run.id
              if ($runId -notmatch '^[0-9]+$') {
                Write-Warning "Keeping github-pages artifact $($artifact.id): workflow run ID is unavailable."
                continue
              }

              $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
              if ([string]$run.name -cne 'pages build and deployment') {
                Write-Warning "Keeping github-pages artifact $($artifact.id): owning workflow is '$($run.name)'."
                continue
              }
              if ([string]$run.status -cne 'completed' -or [string]$run.conclusion -cne 'success') {
                Write-Host "Keeping github-pages artifact $($artifact.id): owning Pages run $runId is status=$($run.status) conclusion=$($run.conclusion)."
                continue
              }

              $targets.Add($artifact)
            }
            if ($items.Count -lt 100) { break }
          }

          [int64]$bytes = 0
          foreach ($artifact in $targets) {
            $runId = [string]$artifact.workflow_run.id
            Write-Host "Deleting completed GitHub Pages transfer artifact $($artifact.id) from successful run $runId created $($artifact.created_at)"
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)" | Out-Null
            $bytes += [int64]$artifact.size_in_bytes
          }

          $mib = [math]::Round($bytes / 1MB, 2)
          Write-Host "Deleted $($targets.Count) completed Pages artifact(s), $mib MiB"
          @"
          ## GitHub Pages artifact cleanup
          - Deleted: **$($targets.Count)** completed ``github-pages`` transfer artifact(s), about **$mib MiB**
          - Trigger: ``$env:EVENT_NAME``
          - Safety gate: artifact owner must be a completed successful ``pages build and deployment`` run.
          - Fallback: hourly cleanup catches completed Pages artifacts if a deployment-status event is unavailable.
          - Published Pages content and deployment history are untouched; only completed Actions transfer artifacts are deleted.
          "@ >> $env:GITHUB_STEP_SUMMARY
