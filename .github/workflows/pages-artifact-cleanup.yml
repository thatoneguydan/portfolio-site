name: GitHub Pages Artifact Cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-artifact-cleanup.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: github-pages-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 10
    steps:
      - name: Delete completed Pages transfer artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $targets = [System.Collections.Generic.List[object]]::new()

          if ($env:EVENT_NAME -eq 'workflow_run') {
            if ($env:COMPLETED_RUN_ID -notmatch '^[0-9]+$') {
              throw 'Completed Pages workflow did not provide a valid run ID.'
            }
            $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:COMPLETED_RUN_ID/artifacts?per_page=100"
            foreach ($artifact in @($response.artifacts)) {
              if ([string]$artifact.name -ceq 'github-pages') { $targets.Add($artifact) }
            }
          }
          else {
            # Initial rollout cleanup. Avoid the current deployment race by only
            # removing Pages transfer artifacts that have already existed for
            # at least five minutes.
            $cutoff = [DateTimeOffset]::UtcNow.AddMinutes(-5)
            for ($page = 1; ; $page++) {
              $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
              $items = @($response.artifacts)
              foreach ($artifact in $items) {
                if ([string]$artifact.name -ceq 'github-pages' -and [DateTimeOffset]$artifact.created_at -lt $cutoff) {
                  $targets.Add($artifact)
                }
              }
              if ($items.Count -lt 100) { break }
            }
          }

          [int64]$bytes = 0
          foreach ($artifact in $targets) {
            Write-Host "Deleting completed GitHub Pages transfer artifact $($artifact.id) created $($artifact.created_at)"
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)" | Out-Null
            $bytes += [int64]$artifact.size_in_bytes
          }

          $mib = [math]::Round($bytes / 1MB, 2)
          Write-Host "Deleted $($targets.Count) completed Pages artifact(s), $mib MiB"
          @"
          ## GitHub Pages artifact cleanup
          - Deleted: **$($targets.Count)** completed ``github-pages`` transfer artifact(s), about **$mib MiB**
          - Trigger: ``$env:EVENT_NAME``
          - Published Pages content and deployment history are untouched; only the completed Actions transfer artifact is deleted.
          "@ >> $env:GITHUB_STEP_SUMMARY
