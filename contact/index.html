<script>
(() => {
  const keys = [29, 71, 43, 97, 13, 53, 83];
  const node = document.querySelector('[data-contact-phone][data-contact-token]');
  if (!node) return;
  const phone = String(node.dataset.contactToken || '').split('.').filter(Boolean).map((part, index) => {
    const value = Number(part);
    return Number.isInteger(value) ? String.fromCharCode(value ^ keys[index % keys.length]) : '';
  }).join('');
  const digits = phone.replace(/\D/g, '');
  node.textContent = phone;
  node.href = `tel:+${digits.length === 10 ? '1' : ''}${digits}`;
})();
</script>
